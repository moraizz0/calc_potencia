
name: Pipeline Java - Potencia Eletrica

on:
  push:
  workflow_dispatch:

jobs:
  executar-testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Executar testes
        run: mvn test
